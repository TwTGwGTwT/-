{{ define "content"}}
<h2>Редактировать трату</h2>

{{if .Error}}
<p class="error">{{.Error}}</p>
{{end}}

<form method="POST" action="/expenses/{{.ID}}/edit">
  <label>
    Сумма:
    <input type="number" name="amount" step="0.01" value="{{.Form.amount}}" required>
  </label><br>
  <label>
    Описание:
    <input type="text" name="description" value="{{.Form.description}}" required>
  </label><br>
  <label>
    Дата:
    <input type="date" name="date" value="{{.Form.date}}" required>
  </label><br>
  <label>
    Категория:
    <select name="category_id" required>
      {{range .Categories}}
      <option value="{{.ID}}" {{if eq (print .ID) $.Form.category_id}}selected{{end}}>{{.Name}}</option>
      {{end}}
    </select>
  </label><br>
  <button type="submit">Сохранить</button>
</form>

<p><a href="/expenses">Вернуться к списку трат</a></p>
{{ end }}
