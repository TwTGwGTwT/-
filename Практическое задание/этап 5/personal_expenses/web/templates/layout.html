{{ define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Учёт личных трат</title>
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<header>
		<h1>Учёт личных трат</h1>
		<nav>
			{{if .LoggedIn}}
				<a href="/expenses">Список трат</a>
				<a href="/expenses/add">Добавить трату</a>
				<span class="user">{{.Email}}</span>
        		<form method="POST" action="/logout" style="display:inline">
            		<button type="submit" class="link-btn">Выйти</button>
        		</form>
    		{{else}}
        		<a href="/login">Вход</a>
        		<a href="/register">Регистрация</a>
    		{{end}}
		</nav>
	</header>
	<main>
		{{template "content" .}}
	</main>
	<footer>
		<p>Практика по веб-разработке на Go</p>
	</footer>
</body>
</html>
{{ end }}
